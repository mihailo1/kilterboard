<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Kilter-like LED orb: bright core → deep violet edge -->
    <radialGradient id="orb" cx="34%" cy="30%" r="72%" fx="30%" fy="26%">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="22%" stop-color="#DDD6FE"/>
      <stop offset="48%" stop-color="#A78BFA"/>
      <stop offset="72%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </radialGradient>
    <radialGradient id="spec" cx="30%" cy="26%" r="42%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="248" fill="url(#orb)"/>
  <circle cx="256" cy="256" r="248" fill="url(#spec)"/>
</svg>
