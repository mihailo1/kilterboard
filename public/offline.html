<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14120b">
<title>Offline · Kilterboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #14120b;
    color: #f5f2eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { max-width: 340px; }
  h1 { margin: 0 0 10px; font-size: 24px; letter-spacing: -0.01em; }
  p { margin: 0 0 22px; color: #9c9689; font-size: 15px; line-height: 1.5; }
  a {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 999px;
    background: #8b5cf6;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>This page isn't saved on your device yet. Set, your drafts and climbs you opened before still work. New climbs load when you're back online.</p>
  <a href="/">Open Kilterboard</a>
</main>
<script>
  window.addEventListener("online", () => location.reload());
</script>
</body>
</html>
